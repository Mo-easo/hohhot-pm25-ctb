services:
  - type: web
    name: hohhot-pm25-ctb
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    healthCheckPath: /api/health
    envVars:
      - key: HOHHOT_DEBUG
        value: "0"
      - key: HOHHOT_DATA_MODE
        value: DEMO
      - key: HOHHOT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"
