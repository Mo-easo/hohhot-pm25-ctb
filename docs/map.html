<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>城市地图 · 青城清气</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/map.css" />
</head>
<body>
  <div class="data-banner"><span class="data-banner__tag">DEMO</span><span>演示数据 · 非实时</span></div>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand__mark"></span><span class="brand__text"><strong>青城清气</strong><small>公开演示站</small></span></a>
    <nav class="nav">
      <a href="index.html">总览</a>
      <a href="monitor.html">空气质量</a>
      <a href="map.html" class="is-active">城市地图</a>
      <a href="prediction.html">预测</a>
      <a href="data-source.html">数据来源</a>
    </nav>
  </header>
  <main class="page">
    <section class="page-intro">
      <h1>城市空间地图</h1>
      <p>点击站点查看详情。手机可双指缩放地图。</p>
    </section>
    <div class="map-stage map-stage--full">
      <div id="full-map" class="map-canvas map-canvas--tall"></div>
    </div>
    <aside id="station-detail" class="station-detail" hidden>
      <h2 id="detail-name">站点</h2>
      <dl id="detail-body"></dl>
    </aside>
  </main>
  <script src="js/config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/main.js"></script>
  <script src="js/map.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      QingchengMap.initFullMap("full-map", "station-detail");
    });
  </script>
</body>
</html>
