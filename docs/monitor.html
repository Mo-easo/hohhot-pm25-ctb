<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>空气质量 · 青城清气</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="data-banner" id="live-banner"><span class="data-banner__tag">DEMO</span><span>演示数据</span></div>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand__mark"></span><span class="brand__text"><strong>青城清气</strong><small>公开演示站</small></span></a>
    <nav class="nav">
      <a href="index.html">总览</a>
      <a href="monitor.html" class="is-active">空气质量</a>
      <a href="map.html">城市地图</a>
      <a href="prediction.html">预测</a>
      <a href="data-source.html">数据来源</a>
    </nav>
  </header>
  <main class="page">
    <section class="page-intro">
      <h1>空气质量监测</h1>
      <p>城市与各站点最新读数（DEMO）。</p>
    </section>
    <section class="simple-grid">
      <div class="chart-card">
        <div class="panel-head"><h2>城市快照</h2></div>
        <div id="monitor-metrics" class="metric-strip metric-strip--compact"></div>
      </div>
      <div class="chart-card">
        <div class="panel-head"><h2>站点列表</h2></div>
        <div class="table-wrap">
          <table id="station-table">
            <thead><tr><th>站点</th><th>城区</th><th>PM2.5</th><th>等级</th><th>时间</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const json = await Qingcheng.getJSON("latest");
      const c = json.data.city;
      document.getElementById("monitor-metrics").innerHTML = `
        <article class="metric metric--focus"><span class="metric__label">PM2.5</span><strong class="metric__value">${c.PM25 ?? "--"}</strong><span class="metric__unit">µg/m³</span><span class="metric__level">${c.level}</span></article>
        <article class="metric"><span class="metric__label">AQI</span><strong class="metric__value">${Math.round(c.AQI ?? 0)}</strong></article>
        <article class="metric"><span class="metric__label">PM10</span><strong class="metric__value">${c.PM10 ?? "--"}</strong></article>
        <article class="metric"><span class="metric__label">NO₂</span><strong class="metric__value">${c.NO2 ?? "--"}</strong></article>`;
      document.querySelector("#station-table tbody").innerHTML = json.data.stations.map(s => `
        <tr><td>${s.station_name}</td><td>${s.district}</td>
        <td style="color:${s.color};font-weight:600">${s.PM25}</td>
        <td>${s.level}</td><td>${s.datetime}</td></tr>`).join("");
      if (json.banner) {
        document.getElementById("live-banner").innerHTML =
          `<span class="data-banner__tag">${json.banner.data_mode}</span><span>${json.banner.data_mode_label}</span>`;
      }
    });
  </script>
</body>
</html>
